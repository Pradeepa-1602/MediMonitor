<!DOCTYPE html>
<html>
<head>
<title>Pill Identifier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-success">
<div class="container">
<h4 class="text-white">Pill Identifier</h4>
<div>
<a href="index.html" class="btn btn-light btn-sm">Home</a>
<a href="emergency.html" class="btn btn-danger btn-sm">Emergency</a>
</div>
</div>
</nav>

<div class="container mt-5">

<h2 class="text-center text-success mb-4">Find Your Medicine</h2>

<div class="card p-4 shadow-lg">

<div class="position-relative mb-3">
  <input type="text" id="search" class="form-control" placeholder="Search..." autocomplete="off">
  <div id="pillSuggestions" class="list-group position-absolute w-100"></div>
</div>

<select id="color" class="form-select mb-3">
<option value="">Any Color</option>
<option>white</option>
<option>pink</option>
<option>yellow</option>
</select>

<select id="shape" class="form-select mb-3">
<option value="">Any Shape</option>
<option>round</option>
<option>oval</option>
<option>capsule</option>
</select>

<button onclick="searchPill()" class="btn btn-success w-100">Search</button>

</div>

<div id="results" class="mt-5"></div>

</div>

<script src="pill.js"></script>
</body>
</html>
