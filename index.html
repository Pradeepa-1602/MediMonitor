<!DOCTYPE html>
<html>
<head>
<title>MediMonitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container">
<h4 class="text-white">MediMonitor</h4>
<div>
<a href="pill.html" class="btn btn-light btn-sm">Pill</a>
<a href="emergency.html" class="btn btn-danger btn-sm">Emergency</a>
</div>
</div>
</nav>

<div class="container mt-5">

<h2 class="text-center text-primary mb-4">Doctor Consultation</h2>

<div class="card p-4 shadow-lg">

<form id="form">

<div class="mb-3">
<label>Patient Name</label>
<input type="text" id="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Age</label>
<input type="number" id="age" class="form-control" required>
</div>

<div class="mb-3 position-relative">
<label>Symptoms</label>
<input type="text" id="symptoms" class="form-control" autocomplete="off" placeholder="fever, headache">
<div id="suggestions" class="list-group position-absolute w-100"></div>
</div>

<button class="btn btn-primary w-100">Consult Doctor</button>

</form>

</div>

<div id="result" class="mt-5"></div>

</div>

<script src="script.js"></script>
</body>
</html>
